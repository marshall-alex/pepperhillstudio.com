<title>Pepper Hill Studio</title>
<meta name="description" content="Pepper Hill Studio: video production, event production, and creative consulting.">
<meta name="theme-color" content="#F7F8F3">
<meta name="color-scheme" content="light">
<script>
  (function () {
    var root = document.documentElement;
    function setMeta(name, value) {
      var m = document.querySelector('meta[name="' + name + '"]');
      if (m) m.setAttribute("content", value);
    }
    function apply() {
      var h = new Date().getHours();
      var night = h >= 19 || h < 7; // 7 PM to 7 AM, visitor's local time
      root.setAttribute("data-theme", night ? "night" : "day");
      setMeta("theme-color", night ? "#3B342E" : "#F7F8F3");
      setMeta("color-scheme", night ? "dark" : "light");
      return night;
    }
    var link = document.createElement("link");
    link.rel = "preload"; link.as = "image";
    link.href = apply() ? "logo-night.png" : "logo.webp";
    document.head.appendChild(link);
    setInterval(apply, 300000);
    // Live scene: on wherever canvas is available.
    if (document.createElement("canvas").getContext) root.classList.add("fx");
  })();
</script>

<style>
  /* Layout: a full-screen painted scene (canvas) with the wordmark and Contact resting on the near hill. */
  :root {
    --paper: #F7F8F3;
    --ink: #294634;
    --ink-deep: #1F3628;
    --ground: #F7F8F3;
    --logo: url("logo.webp");
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  }
  :root[data-theme="night"] {
    --paper: #3B342E;
    --ink: #F1EDE3;
    --ink-deep: #FFFFFF;
    --ground: #3B342E;
    --logo: url("logo-night.png");
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    overscroll-behavior: none;
  }
  #scene {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; display: none;
  }
  .fx #scene { display: block; }
  main {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(28px, 5vh, 44px);
    padding-block: 32px 40px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  .logo {
    margin: 0;
    width: min(360px, 74vw);
    max-width: 100%;
    aspect-ratio: 720 / 567;
    background: var(--logo) center / contain no-repeat;
  }
  /* Scene mode: the tree and hills are drawn live, so the logo block shows only its lettering. */
  .fx main {
    justify-content: flex-end;
    gap: clamp(14px, 2.6vh, 24px);
    padding-block: 24px max(28px, 6.5vh);
    touch-action: pinch-zoom;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .fx .logo {
    width: min(340px, 72vw, 60vh);
    aspect-ratio: 720 / 132;
    background: none;
    color: var(--ink);
  }
  .wordmark { display: none; width: 100%; height: 100%; }
  .fx .wordmark { display: block; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .contact {
    display: inline-block;
    padding: 12px 30px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .01em;
    text-decoration: none;
    transition: background-color .2s ease, color .2s ease;
  }
  .contact:hover { background: var(--ink); color: var(--ground); }
  .contact:active { background: var(--ink-deep); border-color: var(--ink-deep); color: var(--ground); }
  .contact:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  /* Client login: a quiet second button, and a form that opens over the tree's canopy. */
  .links { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .client {
    -webkit-appearance: none; appearance: none;
    background: none; border: 0; border-radius: 999px;
    padding: 8px 14px;
    color: var(--ink);
    font: 500 13px var(--sans);
    letter-spacing: .01em;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px;
    opacity: .85;
    cursor: pointer;
  }
  .client:hover { opacity: 1; }
  .client:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .login {
    position: relative;
    display: flex; flex-direction: column; gap: 10px;
    width: min(300px, 100%);
    padding: 18px; border-radius: 22px;
    background: #9AB694;
    color: #182B1F;
  }
  .login[hidden] { display: none; }
  .fx .login {
    position: fixed; left: var(--lx, 50%); top: var(--ly, 40%); width: var(--lw, 260px);
    padding: 0; background: none;
    opacity: 0; transform: translate(-50%, -50%) scale(.96);
    transition: opacity .22s ease, transform .28s ease;
  }
  .fx .login.open { opacity: 1; transform: translate(-50%, -50%) scale(1); transition-delay: .14s; }
  .login .row { display: flex; gap: 8px; }
  .login input {
    width: 100%; height: 44px; padding: 0 18px;
    border: 1.5px solid transparent; border-radius: 999px;
    background: rgba(247, 248, 243, .95);
    color: #182B1F;
    font: 400 16px var(--sans);            /* 16px keeps phones from zooming in on focus */
    outline: none;
  }
  .login input::placeholder { color: rgba(24, 43, 31, .55); }
  .login input:focus-visible { border-color: #182B1F; }
  .login .go {
    flex: 1; height: 44px; border: 0; border-radius: 999px;
    background: #233D2C; color: #F7F8F3;
    font: 500 15px var(--sans); letter-spacing: .01em;
    cursor: pointer;
  }
  .login .go:disabled { opacity: .7; cursor: default; }
  .login .go:focus-visible, .login .shut:focus-visible { outline: 2px solid #182B1F; outline-offset: 2px; }
  .login .msg { margin: 0; font-size: 13px; line-height: 1.35; text-align: center; text-wrap: balance; }
  .login .msg:empty { display: none; }
  .login .shut {
    flex: none; width: 44px; height: 44px; padding: 0;
    border: 1.5px solid #233D2C; border-radius: 50%; background: none;
    color: #182B1F; font: 400 22px/1 var(--sans);
    cursor: pointer;
  }
  /* On short screens the form takes the middle of the page, so the things under it step aside. */
  @media (max-height: 520px) {
    .fx main.login-open .logo, .fx main.login-open .links, .fx main.login-open .hint { visibility: hidden; }
  }
  .hint {
    display: none;
    margin: 0;
    min-height: 1.4em;
    font-size: 13px;
    letter-spacing: .01em;
    text-align: center;
    text-wrap: balance;
    max-width: 100%;
    color: var(--ink);
    opacity: .8;
    transition: opacity .8s ease;
  }
  .fx .hint { display: block; }
  .hint.done { opacity: 0; }
  @media (max-height: 460px) { .fx .hint { display: none; } }
  @media (prefers-reduced-motion: reduce) { .contact, .hint, .fx .login { transition: none; } }
</style>
</head>

  <div class="links">
    <a class="contact" id="contact" href="#contact">Contact</a>
    <button class="client" id="client" type="button" aria-expanded="false" aria-controls="login">Client Login</button>
  </div>
  <form class="login" id="login" hidden novalidate aria-labelledby="login-title">
    <h2 class="visually-hidden" id="login-title">Client login</h2>
    <label class="visually-hidden" for="login-user">Username</label>
    <input id="login-user" name="username" type="text" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label class="visually-hidden" for="login-pass">Password</label>
    <input id="login-pass" name="password" type="password" placeholder="Password" autocomplete="current-password">
    <div class="row">
      <button class="go" id="login-go" type="submit">Sign in</button>
      <button class="shut" id="login-shut" type="button" aria-label="Close client login">&times;</button>
    </div>
    <p class="msg" id="login-msg" role="alert"></p>
  </form>
  <p class="hint" id="hint" aria-hidden="true"></p>
</main>
<script>
  document.getElementById("contact").addEventListener("click", function (e) {
    e.preventDefault();
    var to = "mailto:" + ["hello", "pepperhillstudio.com"].join("@");
    // If the visitor set the light, their choice rides along in the subject line.
    var light = window.pepperHillLight && window.pepperHillLight();
    if (light) to += "?subject=" + encodeURIComponent("Hello from " + light.name.toLowerCase() + " on Pepper Hill (" + light.time + ")");
    window.location.href = to;
  });
</script>
<script>
  // Client login. For now this is a placeholder: nothing typed here is sent or stored anywhere,
  // and every attempt gets the same answer.
  (function () {
    var btn = document.getElementById("client"), form = document.getElementById("login");
    var user = document.getElementById("login-user"), pass = document.getElementById("login-pass");
    var go = document.getElementById("login-go"), msg = document.getElementById("login-msg");
    var busy = 0, hide = 0;
    function open() {
      clearTimeout(hide);
      form.hidden = false;
      btn.setAttribute("aria-expanded", "true");
      form.getBoundingClientRect();                 // lets the opening transition run
      form.classList.add("open");
      form.parentNode.classList.add("login-open");
      if (window.matchMedia && matchMedia("(hover: hover) and (pointer: fine)").matches) user.focus();
    }
    function close() {
      clearTimeout(busy); busy = 0;
      form.classList.remove("open");
      form.parentNode.classList.remove("login-open");
      btn.setAttribute("aria-expanded", "false");
      go.disabled = false; go.textContent = "Sign in";
      user.value = ""; pass.value = ""; msg.textContent = "";
      hide = setTimeout(function () { form.hidden = true; }, 300);
      btn.focus();
    }
    btn.addEventListener("click", function () { if (form.classList.contains("open")) close(); else open(); });
    document.getElementById("login-shut").addEventListener("click", close);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && form.classList.contains("open")) close(); });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (busy) return;
      msg.textContent = "";
      go.disabled = true; go.textContent = "Signing in\u2026";
      busy = setTimeout(function () {
        busy = 0;
        go.disabled = false; go.textContent = "Sign in";
        pass.value = "";
        msg.textContent = "We couldn\u2019t confirm those credentials. Please try again.";
        window.dispatchEvent(new Event("pepperhill:denied"));
        pass.focus();
      }, 800);
    });
  })();
</script>
