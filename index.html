<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pepper Hill Studio</title>
<meta name="description" content="Pepper Hill Studio: video production, event production, and creative consulting.">
<meta name="theme-color" content="#F7F8F3">
<meta name="color-scheme" content="light">
<script>
  (function () {
    var root = document.documentElement;
    function apply() {
      var h = new Date().getHours();
      var night = h >= 19 || h < 7; // 7 PM to 7 AM, visitor's local time
      root.setAttribute("data-theme", night ? "night" : "day");
      document.querySelector('meta[name="theme-color"]').setAttribute("content", night ? "#3B342E" : "#F7F8F3");
      document.querySelector('meta[name="color-scheme"]').setAttribute("content", night ? "dark" : "light");
      return night;
    }
    var link = document.createElement("link");
    link.rel = "preload"; link.as = "image";
    link.href = apply() ? "/logo-night.png" : "/logo.webp";
    document.head.appendChild(link);
    setInterval(apply, 300000);
  })();
</script>
<link rel="canonical" href="https://pepperhillstudio.com/">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pepperhillstudio.com/">
<meta property="og:title" content="Pepper Hill Studio">
<meta property="og:description" content="Video production, event production, and creative consulting.">
<meta property="og:image" content="https://pepperhillstudio.com/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --paper: #F7F8F3;
    --ink: #294634;
    --ink-deep: #1F3628;
    --logo: url("/logo.webp");
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  }
  :root[data-theme="night"] {
    --paper: #3B342E;
    --ink: #F1EDE3;
    --ink-deep: #FFFFFF;
    --logo: url("/logo-night.png");
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    transition: background-color .4s ease;
  }
  main {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(28px, 5vh, 44px);
    padding: 32px max(20px, env(safe-area-inset-right)) 40px max(20px, env(safe-area-inset-left));
  }
  .logo {
    margin: 0;
    width: min(360px, 74vw);
    aspect-ratio: 720 / 567;
    background: var(--logo) center / contain no-repeat;
  }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .contact {
    display: inline-block;
    padding: 12px 30px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .01em;
    text-decoration: none;
    transition: background-color .2s ease, color .2s ease, border-color .2s ease;
  }
  .contact:hover { background: var(--ink); color: var(--paper); }
  .contact:active { background: var(--ink-deep); border-color: var(--ink-deep); color: var(--paper); }
  .contact:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) { body, .contact { transition: none; } }
</style>
</head>
<body>
<main>
  <h1 class="logo"><span class="visually-hidden">Pepper Hill Studio</span></h1>
  <a class="contact" id="contact" href="#contact">Contact</a>
</main>
<script>
  document.getElementById("contact").addEventListener("click", function (e) {
    e.preventDefault();
    window.location.href = "mailto:" + ["hello", "pepperhillstudio.com"].join("@");
  });
</script>
</body>
</html>
